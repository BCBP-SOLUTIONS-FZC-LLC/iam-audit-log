asyncapi: 3.0.0
info:
  title: Audit Log Service — Inbound Events
  version: 0.1.0
  description: 'iam-audit-log is a pure sink (LLD §7). It consumes every audit-bearing

    topic through its own catch-all SQS subscription (no SNS filter policy,

    AL-EVT-2) and publishes nothing: this document declares only `receive`

    operations — zero `send` (AL-INV-10, AL-EVT-1; enforced in CI by

    .github/scripts/check-asyncapi-receive-only.sh).


    Wire format: CloudEvents-style platform envelope (platform-events

    Envelope); Glue-framed payloads (18-byte header) decoded when the

    envelope''s `dataschema` is populated (AL-D12). Queues are

    `<topic-short>-audit-q`, each with `<queue>-dlq`, maxReceiveCount=5.

    Dedup: processed_events (event_id, consumer) (AL-INV-4).


    Per-event message schemas are added in Phase 3 (§7.1 taxonomy).


    Every message declares x-audit-entry-type / x-audit-retention-tier: the

    §7.1 classification (AL-D3). A type not listed here is still persisted as

    <domain>.unknown (AL-EVT-4).

    '
defaultContentType: application/json
tags:
- name: consumed
  description: Messages this service receives.
servers:
  authAuditQueue:
    host: sqs.ap-south-1.amazonaws.com
    protocol: sqs
