components:
  tags:
    consumed:
      name: consumed
      description: Messages this service receives.
  messages:
    authAudit_LoginSuccess:
      name: LoginSuccess
      title: LoginSuccess
      summary: LoginSuccess on iam.auth.events → entry_type auth.login.success (access_90d).
      tags:
      - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProducerPayload'
      x-audit-topic: iam.auth.events
      x-audit-entry-type: auth.login.success
      x-audit-retention-tier: access_90d
    authAudit_LoginFailure:
      name: LoginFailure
