# Prometheus recording rules for iam-audit-log (LLD §11; Enterprise Platform
# Observability Standard, gap 46). Naming: service:<metric>:<aggregation>.
# Every series (all tiers, and the platform libraries') carries the injected
# {domain, service, environment}, and every rule aggregates by it, so the same
# expressions hold for every platform service. Part of the Helm
# PrometheusRule (TestAlerts_StaticMirrorMatchesHelm), and read by
# app-alerts.yml, slo-rules.yml and dashboard-audit-log.json. No rule reads a
# removed or deprecated metric (TestAlerts_ReferenceKnownMetrics, metricslint
# refs). A rule on a Proposed (not yet ratified) platform_* metric is marked
# with a "# metric_status: proposed" comment on the line above it
# (metrics-registry-lint.sh).
groups:
  - name: iam-audit-log.rules
    interval: 30s
    rules:
      # ---- Tier-1 messaging throughput ----
      - record: service:platform_messages_received:rate5m
        expr: sum by (domain, service, environment, queue) (rate(platform_messages_received_total{domain="iam", service="iam-audit-log"}[5m]))
      - record: service:platform_messages_processed:rate5m
        expr: sum by (domain, service, environment) (rate(platform_messages_processed_total{domain="iam", service="iam-audit-log"}[5m]))
      - record: service:platform_messages_failed:rate5m
        expr: sum by (domain, service, environment, reason) (rate(platform_messages_failed_total{domain="iam", service="iam-audit-log"}[5m]))
      - record: service:platform_retry:rate5m
        expr: sum by (domain, service, environment, operation) (rate(platform_retry_total{domain="iam", service="iam-audit-log"}[5m]))
      - record: service:platform_dlq_messages:rate5m
        expr: sum by (domain, service, environment, operation, reason) (rate(platform_dlq_messages_total{domain="iam", service="iam-audit-log"}[5m]))
      # metric_status: proposed
      - record: service:platform_duplicate_messages:rate5m
        expr: sum by (domain, service, environment) (rate(platform_duplicate_messages_total{domain="iam", service="iam-audit-log"}[5m]))

      # ---- failure ratio (backs IAMAuditLogMessageFailures) ----
      # reason="dead_letter_error" is excluded: the dead-letter handler returns
      # an error on purpose so the SQS redrive moves the message (counted in
      # platform_dlq_messages_total instead).
      - record: service:platform_messages_failure_ratio:5m
        expr: |
          sum by (domain, service, environment) (rate(platform_messages_failed_total{domain="iam", service="iam-audit-log", reason!="dead_letter_error"}[5m]))
          /
          clamp_min(sum by (domain, service, environment) (rate(platform_messages_received_total{domain="iam", service="iam-audit-log"}[5m])), 1e-9)

      # ---- dependencies ----
      # metric_status: proposed
      - record: service:platform_dependency_request:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (domain, service, environment, dependency, operation, le) (rate(platform_dependency_request_seconds_bucket{domain="iam", service="iam-audit-log"}[5m])))
      # metric_status: proposed
      - record: service:platform_dependency_request_error_ratio:10m
        expr: |
          sum by (domain, service, environment, dependency) (rate(platform_dependency_request_seconds_count{domain="iam", service="iam-audit-log", outcome="error"}[10m]))
          /
          clamp_min(sum by (domain, service, environment, dependency) (rate(platform_dependency_request_seconds_count{domain="iam", service="iam-audit-log"}[10m])), 1e-9)

      # ---- propagation (envelope time → received by platform-events' consumer) ----
      # metric_status: proposed
      - record: service:platform_event_propagation:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (domain, service, environment, le) (rate(platform_event_propagation_seconds_bucket{domain="iam", service="iam-audit-log"}[5m])))

      # ---- queues ----
      # metric_status: proposed
      - record: service:platform_queue_depth:max
        expr: max by (domain, service, environment, queue) (platform_queue_depth{domain="iam", service="iam-audit-log"})
      # metric_status: proposed
      - record: service:platform_dlq_depth:max
        expr: max by (domain, service, environment, queue) (platform_dlq_depth{domain="iam", service="iam-audit-log"})

      # ---- query API availability (gincommon's platform_http_* carry the same identity) ----
      # metric_status: proposed
      - record: service:platform_http_requests_error_ratio:5m
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{domain="iam", service="iam-audit-log", status_class="5xx"}[5m]))
          /
          clamp_min(sum by (domain, service, environment) (rate(platform_http_requests_total{domain="iam", service="iam-audit-log"}[5m])), 1e-9)

      # ---- Tier-3 ingest ----
      - record: service:iam_audit_log_events_ingested:rate5m
        expr: sum by (domain, service, environment, ingest_mode) (rate(iam_audit_log_events_ingested_total{domain="iam", service="iam-audit-log"}[5m]))
      - record: service:iam_audit_log_ingest_lag:p99_15m
        expr: |
          histogram_quantile(0.99,
            sum by (domain, service, environment, le) (rate(iam_audit_log_ingest_lag_seconds_bucket{domain="iam", service="iam-audit-log"}[15m])))

      # ---- Tier-3 archive and redaction health ----
      - record: service:iam_audit_log_archive_stalled_partitions:max
        expr: max by (domain, service, environment) (iam_audit_log_archive_stalled_partitions{domain="iam", service="iam-audit-log"})
      - record: service:iam_audit_log_archive_lag_seconds:max
        expr: max by (domain, service, environment) (iam_audit_log_archive_lag_seconds{domain="iam", service="iam-audit-log"})
      - record: service:iam_audit_log_default_partition_rows:max
        expr: max by (domain, service, environment) (iam_audit_log_default_partition_rows{domain="iam", service="iam-audit-log"})
      - record: service:iam_audit_log_redaction_pending_tasks:max
        expr: max by (domain, service, environment) (iam_audit_log_redaction_pending_tasks{domain="iam", service="iam-audit-log"})
      - record: service:iam_audit_log_redaction_tasks:rate1h
        expr: sum by (domain, service, environment, status) (rate(iam_audit_log_redaction_tasks_total{domain="iam", service="iam-audit-log"}[1h]))
