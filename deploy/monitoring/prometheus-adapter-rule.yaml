# prometheus-adapter rules backing the optional HPA metrics in
# deploy/helm/templates/hpa.yaml (LLD §13; Enterprise Platform Observability
# Standard, gap 46: "HPA metric references"). Both read Proposed (not yet
# ratified) platform_* metrics, so each rule is marked
# "# metric_status: proposed" and the HPA carries the
# observability.platform/metric-status: proposed annotation
# (metrics-registry-lint.sh).
rules:
  # Pods metric: per-pod request rate from gincommon's
  # platform_http_requests_total (autoscaling.targetRPSPerReplica).
  custom:
    # metric_status: proposed
    - seriesQuery: 'platform_http_requests_total{domain="iam",service="iam-audit-log",namespace!="",pod!=""}'
      resources: { overrides: { namespace: { resource: namespace }, pod: { resource: pod } } }
      name: { matches: "platform_http_requests_total", as: "platform_http_requests_per_second" }
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
  # External metric: total backlog across the 11 inbound audit queues, from
  # platform_queue_depth (autoscaling.targetQueueDepthPerReplica).
  external:
    # metric_status: proposed
    - seriesQuery: 'platform_queue_depth{domain="iam",service="iam-audit-log"}'
      resources: { overrides: { namespace: { resource: namespace } } }
      name: { matches: "platform_queue_depth", as: "platform_queue_depth_audit_log" }
      metricsQuery: 'sum(max by (queue) (<<.Series>>{<<.LabelMatchers>>}))'
