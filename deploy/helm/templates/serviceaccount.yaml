{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iam-audit-log.serviceAccountName" . }}
  labels:
    {{- include "iam-audit-log.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The projected token is used by IRSA (S3 / KMS / SQS / Glue — LLD §13), so
# it must stay automounted.
automountServiceAccountToken: true
{{- end }}
