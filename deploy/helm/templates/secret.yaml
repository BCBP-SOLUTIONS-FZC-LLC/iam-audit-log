{{- /*
Two Secrets, one per composition root (LLD §3.3.2, §10.4; implementation
rule 5): the server Secret carries only the audit_app + audit_migrator DSNs,
the reconciler Secret only the audit_reconciler DSN, so neither pod can ever
read the other role's credentials.

Production: set secrets.<root>.existingSecret to a pre-provisioned Secret
(External Secrets Operator / Secrets Manager CSI). secretValues is dev/CI
only — Helm stores it in release history (base64, not encrypted).
*/ -}}
{{- range $root := list "server" "reconciler" }}
{{- $cfg := index $.Values.secrets $root }}
{{- if not $cfg.existingSecret }}
{{- range $cfg.keys }}
{{- if not (index $cfg.values .) }}
{{- fail (printf "Secret key %q (secrets.%s) is required. Set secrets.%s.existingSecret or --set 'secrets.%s.values.%s=<value>'." . $root $root $root .) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include (printf "iam-audit-log.%sSecretName" $root) $ }}
  labels:
    {{- include "iam-audit-log.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $root }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $cfg.keys }}
  {{ . }}: {{ index $cfg.values . | quote }}
  {{- end }}
{{- end }}
{{- end }}
