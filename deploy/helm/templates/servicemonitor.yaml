{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "iam-audit-log.fullname" . }}
  labels:
    {{- include "iam-audit-log.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "iam-audit-log.selectorLabels" . | nindent 6 }}
  endpoints:
    # Metrics are served on the dedicated "metrics" port (9090), separate
    # from the "http" API port — scraping never touches the API surface.
    # Covers every series this process exposes, all carrying
    # {domain="iam", service="iam-audit-log", environment}: the Tier 3
    # iam_audit_log_* and Tier 2 iam_rls_violations_total business metrics
    # (§11), the Tier 1 platform_* metrics the service records (dlq, duplicate,
    # dependency, queue/DLQ depth — statuses in
    # internal/adapter/outbound/metrics/registry.go), and the platform_*
    # metrics platform-gincommon (platform_http_*, platform_build_info),
    # platform-events (platform_messages_*, platform_dependency_request_seconds
    # for sqs/codec) and platform-pgcommon (platform_db_*) emit.
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
