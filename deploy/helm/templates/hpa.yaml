{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "iam-audit-log.fullname" . }}
  labels:
    {{- include "iam-audit-log.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "iam-audit-log.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetRPSPerReplica }}
    # RPS-based scaling: opt-in, off by default (§14 has no queue-depth/RPS
    # scaling requirement for this service). PREREQUISITE: prometheus-adapter
    # must be installed and configured with the rule at
    # deploy/monitoring/prometheus-adapter-rule.yaml. Without it this metric
    # is silently absent from the custom metrics API and the HPA falls back
    # to CPU/memory only.
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetRPSPerReplica }}
    {{- end }}
    {{- if .Values.autoscaling.targetQueueDepthPerReplica }}
    # Queue-backlog scaling: opt-in, off by default. Scales on the total
    # backlog of the 11 inbound audit queues (the Canonical
    # platform_queue_depth, summed by prometheus-adapter as
    # platform_queue_depth_audit_log). PREREQUISITE: the external rule in
    # deploy/monitoring/prometheus-adapter-rule.yaml.
    - type: External
      external:
        metric:
          name: platform_queue_depth_audit_log
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetQueueDepthPerReplica | quote }}
    {{- end }}
{{- end }}
