basePath: /api/v1
definitions:
  http.ActorDTO:
    properties:
      display:
        example: asha@acme.example
        type: string
      id:
        example: 7f3c2d1e-9a8b-4c5d-8e7f-0a1b2c3d4e5f
        type: string
      type:
        enum:
        - user
        - service_account
        - iam_system
        - anonymous
        example: user
        type: string
    type: object
  http.BatchEntryRequest:
    properties:
      action:
        example: update
        type: string
      actor:
        $ref: '#/definitions/http.ActorDTO'
      entry_type:
        example: config.tenant_setting.changed
        type: string
      idempotency_key:
        example: 4b1f0f8e-2c1d-5e3a-9f0b-7c6d5e4f3a21
        type: string
      ip_address:
        example: 203.0.113.7
        type: string
      metadata:
        type: object
      occurred_at:
        example: "2026-03-14T09:12:04Z"
        type: string
      source_event_type:
        example: TenantSettingChanged
        type: string
      source_service:
        example: iam-org-membership
        type: string
      target:
        $ref: '#/definitions/http.TargetDTO'
      tenant_id:
        example: 00000000-0000-0000-0000-0000000000b1
        type: string
      trace_id:
        type: string
      user_agent:
        type: string
    type: object
  http.BatchRequest:
    properties:
      entries:
        items:
          $ref: '#/definitions/http.BatchEntryRequest'
        type: array
    type: object
  http.BatchResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/http.BatchResultItem'
        type: array
    type: object
  http.BatchResultItem:
    properties:
      code:
        example: unknown_entry_type
        type: string
      id:
        type: string
      index:
        type: integer
      message:
        type: string
      status:
        example: 201
        type: integer
    type: object
  http.DirectWriteRequest:
    properties:
      action:
        example: update
        type: string
      actor:
        $ref: '#/definitions/http.ActorDTO'
      entry_type:
        example: config.tenant_setting.changed
        type: string
      ip_address:
        example: 203.0.113.7
        type: string
      metadata:
        type: object
      occurred_at:
        example: "2026-03-14T09:12:04Z"
        type: string
      source_event_type:
        example: TenantSettingChanged
        type: string
      source_service:
        example: iam-org-membership
        type: string
      target:
        $ref: '#/definitions/http.TargetDTO'
      tenant_id:
        example: 00000000-0000-0000-0000-0000000000b1
        type: string
      trace_id:
        type: string
      user_agent:
        type: string
    type: object
  http.EntryResponse:
    properties:
      action:
        type: string
      actor:
        $ref: '#/definitions/http.ActorDTO'
      entry_type:
        type: string
      id:
        type: string
      ingest_mode:
        type: string
      ip_address:
        type: string
      metadata:
        type: object
      occurred_at:
        type: string
      recorded_at:
        type: string
      retention_tier:
        type: string
      source_event_id:
        type: string
      source_event_type:
        type: string
      source_service:
        type: string
      source_topic:
        type: string
      target:
        $ref: '#/definitions/http.TargetDTO'
      tenant_id:
        type: string
      trace_id:
        type: string
      user_agent:
        type: string
    type: object
  http.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
      status:
        type: integer
      trace_id:
        type: string
    type: object
  http.TargetDTO:
    properties:
      id:
        example: mfa_freshness_seconds
        type: string
      type:
        example: tenant_setting
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: indhu@bcbpsolutions.com
    name: BCBP Solutions
  description: |-
    Audit Log Service — the platform compliance system-of-record (LLD §1). Append-only, tenant-scoped audit trail.

    **Public** `/api/v1/audit/*` (AL-1..AL-4): tenant_admin / tenant_owner only; RLS-scoped to x-tenant-id; plan-gated query window.
    **Internal** `/api/v1/internal/*` (AL-5..AL-7): mesh-only, iam-system peers; direct-write ingest requires `Idempotency-Key`.
  license:
    name: Proprietary
  title: IAM Audit Log API
  version: "0.1"
paths:
  /internal/audit-entries:
    post:
      consumes:
      - application/json
      description: Mesh-only ingest for non-bus audit entries (LLD §5.4, AL-D1). The
        Idempotency-Key header becomes the entry's source_event_id; a retry with the
        same key returns 200 with the already-persisted entry. retention_tier is derived
        from entry_type — a caller-supplied value is ignored (AL-INV-11). Only direct-write
        entry types are accepted (decision D-6).
      parameters:
      - description: Audit entry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.DirectWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: idempotent replay
          schema:
            $ref: '#/definitions/http.EntryResponse'
        "201":
          description: created
          schema:
            $ref: '#/definitions/http.EntryResponse'
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: forbidden_peer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: unknown_entry_type | invalid_actor | metadata_too_large
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - TenantRoles: []
      - TenantID: []
      - UserID: []
      - IdempotencyKey: []
      summary: Direct-write one audit entry (AL-5)
      tags:
      - Ingest
  /internal/audit-entries:batch:
    post:
      consumes:
      - application/json
      description: 'Up to MAX_INGEST_BATCH entries, each with its own idempotency_key
        (decision D-4). Always 207: per-index status 201 (created), 200 (replay) or
        the §17 error; a bad entry never rejects the batch. Rate-limited per tenant
        (429, §10.5).'
      parameters:
      - description: Entries
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.BatchRequest'
      produces:
      - application/json
      responses:
        "207":
          description: per-entry results
          schema:
            $ref: '#/definitions/http.BatchResponse'
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: forbidden_peer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: batch_too_large
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - TenantRoles: []
      - TenantID: []
      - UserID: []
      - IdempotencyKey: []
      summary: Direct-write a batch of audit entries (AL-6)
      tags:
      - Ingest
securityDefinitions:
  IdempotencyKey:
    description: Required on AL-5/AL-6; becomes the entry's source_event_id (LLD §5.4).
    in: header
    name: Idempotency-Key
    type: apiKey
  TenantID:
    description: Tenant UUID injected by the gateway / mesh caller.
    in: header
    name: x-tenant-id
    type: apiKey
  TenantRoles:
    description: 'Gateway/mesh-injected roles: tenant_admin|tenant_owner (public)
      or iam-system (internal).'
    in: header
    name: x-tenant-roles
    type: apiKey
  UserID:
    description: Caller subject (or the iam-system sentinel …00a1).
    in: header
    name: x-user-id
    type: apiKey
swagger: "2.0"
